<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R0D10N Portfolio - Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect hack
    // Redirect all 404s to index.html with the path as a query parameter
    const pathSegmentsToKeep = 1; // Change to 0 if using a custom domain
    const l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <div style="text-align: center; margin-top: 50px; font-family: Arial, sans-serif;">
    <h1>🚀 Redirecting...</h1>
    <p>Перенаправляем на портфолио R0D10N...</p>
  </div>
</body>
</html>
